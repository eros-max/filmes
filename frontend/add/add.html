<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="add.css">
    <title>Adicionar filmes</title>
</head>
<body>
    <header>
        <a href="../index.html">Voltar a Lista</a>
        <h1>Cadastrar novo filme</h1>
    </header>

    <main>
        <form>
            <div>
                <label for="title">Título:</label>
                <input type="text" id="title" placeholder="Digite o título">
            </div>
            <div>
                <label for="genre">Gênero:</label>
                <input type="text" id="genre" placeholder="Digite o gênero">
            </div>
            <div>
                <label for="ageRating">Classificação indicativa:</label>
                <input type="number" id="ageRating" placeholder="Digite a Classificação">
            </div>
            <div>
                <label for="duration">Duração:</label>
                <input type="number" id="duration" placeholder="Digite a duração">
            </div>
        </form>

        <button>Adicionar</button>
    </main>

    <script src="./add.js"></script>
</body>
</html>
